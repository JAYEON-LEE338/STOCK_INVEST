<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOCK_INVEST 대시보드</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--up:#dc2626;--down:#2563eb;--warn:#b45309;--bad:#b91c1c;--okbg:#dcfce7;--okfg:#166534;--warnbg:#fef3c7;--badbg:#fee2e2;--buyzone:rgba(22,163,74,.22);--sellzone:rgba(220,38,38,.20);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--text:#e5e7eb;--muted:#9aa3b2;--line:#2a303c;--accent:#60a5fa;--up:#f87171;--down:#60a5fa;--warn:#fbbf24;--bad:#f87171;--okbg:#14532d;--okfg:#bbf7d0;--warnbg:#451a03;--badbg:#450a0a;--buyzone:rgba(74,222,128,.22);--sellzone:rgba(248,113,113,.22);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;padding:0 16px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--okfg)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}
.big{font-size:24px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.muted{color:var(--muted)}
.wide{grid-column:1/-1}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer}
button.warnbtn{background:var(--bad)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.5;cursor:default}
pre{margin:0;max-height:300px;overflow:auto;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.WARNING{color:var(--warn)}.ERROR{color:var(--bad)}
.err{color:var(--bad);font-size:12px}
.gauge{position:relative;height:34px;margin:26px 8px 34px;border-radius:6px;background:var(--line)}
.zone{position:absolute;top:0;bottom:0}
.edge{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--muted)}
.edge span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;margin-top:6px}
.edge b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;margin-bottom:2px}
.marker{position:absolute;top:-10px;bottom:-10px;width:4px;margin-left:-2px;background:var(--accent);border-radius:2px}
.marker i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.boxform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.boxform input{width:100px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs{flex-wrap:wrap}
.tab{background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:8px 16px;font-size:13px}
.tab.on{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:700}
.rule{display:flex;gap:10px;align-items:baseline;padding:4px 0}.rule b{min-width:1.4em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>STOCK_INVEST</h1>
  <div class="badges" id="badges"></div>
  <div><span class="muted" id="now"></span> <button class="ghost" id="refresh">새로고침</button> <button class="ghost" id="pwBtn">비밀번호 변경</button> <a href="/logout" class="muted" style="font-size:12px">로그아웃</a></div>
</header>
<div class="tabs"><button class="tab" data-tab="main">대시보드</button><button class="tab" data-tab="fear">공포지수</button><button class="tab" data-tab="box">박스권</button><button class="tab" data-tab="mom">모멘텀</button><button class="tab" data-tab="scalp">초단타</button></div>
<div class="grid" id="grid"><div class="card">불러오는 중…</div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const num = (n, d=2) => Number(n).toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = n => `<span class="${n>0?'up':n<0?'down':''}">${n>0?'+':''}${Number(n).toFixed(2)}%</span>`;
const isErr = v => v && typeof v === 'object' && 'error' in v;
const errTxt = v => `<div class="err">${esc(v.error)}</div>`;

function boxCard(b){
  if (!b) return '';
  if (isErr(b)) return `<div class="card wide"><h2>코스피 박스권</h2>${errTxt(b)}</div>`;
  const LO = -0.25, HI = 1.25, x = p => ((Math.min(Math.max(p, LO), HI) - LO) / (HI - LO) * 100);
  const state = !b.valid ? '박스 폭 부족 (전략 쉼)'
    : b.pos <= b.buy_pos && b.pos >= b.min_pos ? '매수 구간 (하단 근접)'
    : b.pos >= b.ladder[0] ? '매도 구간 (상단 근접)' : '중간 (관망)';
  const sellLines = b.ladder.map(t => `<div class="edge" style="left:${x(t)}%;opacity:.45;top:0;bottom:0;width:1px"></div>`).join('');
  return `<div class="card wide"><h2>코스피 박스권 ${b.source==='manual'?'(직접 설정)':`(자동 산정: 최근 ${b.days}거래일, ${esc(b.from)} ~ ${esc(b.to)})`}</h2>
    <div class="row"><span><b>현재 ${num(b.current)}</b> · 박스 내 위치 <b>${(b.pos*100).toFixed(0)}%</b></span><span><b>${state}</b></span></div>
    <div class="gauge">
      <div class="zone" style="left:${x(b.min_pos)}%;width:${x(b.buy_pos)-x(b.min_pos)}%;background:var(--buyzone)"></div>
      <div class="zone" style="left:${x(b.ladder[0])}%;width:${x(1)-x(b.ladder[0])}%;background:var(--sellzone)"></div>
      ${sellLines}
      <div class="edge" style="left:${x(0)}%"><b>하단</b><span>${num(b.lower,0)}</span></div>
      <div class="edge" style="left:${x(1)}%"><b>상단</b><span>${num(b.upper,0)}</span></div>
      <div class="marker" style="left:${x(b.pos)}%"><i>${num(b.current,0)}</i></div>
    </div>
    <div class="legend"><span><s style="background:var(--buyzone)"></s>매수 구간 (위치 ≤ ${(b.buy_pos*100).toFixed(0)}%, 15:20 종가)</span>
    <span><s style="background:var(--sellzone)"></s>매도 구간 (${b.ladder.map(t=>(t*100).toFixed(0)+'%').join(' / ')} 도달마다 25%)</span>
    <span>박스 폭 ${(b.width*100).toFixed(1)}%</span></div>
    <div class="boxform"><span class="muted">박스권 직접 설정</span>
      하단 <input id="boxLo" type="number" step="any" value="${Math.round(b.lower)}">
      상단 <input id="boxHi" type="number" step="any" value="${Math.round(b.upper)}">
      <button id="boxSave">저장</button>
      ${b.source==='manual'?'<button class="ghost" id="boxAuto">자동 산정으로</button>':''}
      <span class="err" id="boxErr"></span></div></div>`;
}

function sigCard(title, sig, extra){
  if (!sig || !sig.date) return `<div class="card"><h2>${title}</h2><span class="muted">아직 판단 기록이 없습니다</span></div>`;
  const items = (sig.items||[]).map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.code)}</td>
    <td class="n">${i.vol_ratio!==undefined?'×'+i.vol_ratio:(i.qty?i.qty+'주':'')}</td></tr>`).join('');
  return `<div class="card"><h2>${title}</h2>
    <div class="row"><span class="muted">판단일</span><span>${esc(sig.date)}</span></div>
    ${sig.sector?`<div class="row"><span class="muted">주도 섹터</span><span>${esc(sig.sector)}</span></div>`:''}
    ${extra||''}
    <div style="margin:6px 0"><b>${esc(sig.result)}</b></div>
    ${items?`<div class="tblwrap"><table><tr><th>종목</th><th>코드</th><th class="n">${sig.items[0]&&sig.items[0].vol_ratio!==undefined?'거래량 배수':'수량'}</th></tr>${items}</table></div>`:''}</div>`;
}

let TAB = 'main';
try { const t = localStorage.getItem('tab'); TAB = ['fear','box','mom','scalp'].includes(t) ? t : 'main'; } catch(e) {}

const trendTxt = t => !t || t.trend==='unknown' ? '<span class="muted">기록 부족 (판단 보류)</span>' : `${pct(t.pct)} <span class="badge ${t.trend==='up'?'b-ok':t.trend==='down'?'b-bad':'b-warn'}">${{up:'상승',down:'하락 — 매수 제외',flat:'보합'}[t.trend]}</span>`;
let CAND = {t: 0, data: null, loading: false};
function candHtml(d){
  const c = CAND.data;
  if (!c) return '<span class="muted">불러오는 중…</span>';
  if (isErr(c)) return errTxt(c);
  const ok = v => `<span class="${v?'up':'muted'}">${v?'●':'○'}</span>`;
  const idxOk = typeof c.index_pct === 'number' && c.index_pct >= d.mom_cfg.index_min;
  const rows = c.items.map(i => `<tr><td>${i.pick?'<b>매수 대상</b>':''}</td><td>${esc(i.name)}</td><td>${esc(i.sector)}</td>
    <td class="n">${won(i.price)}</td><td class="n">${pct(i.change_pct)}</td><td class="n">${won(Math.round(i.value/1e6)*1e6).replace('원','')}</td>
    <td>${ok(i.c_sector)} 주도섹터 ${ok(i.c_up)} 상승 ${ok(i.c_hot)} 과열아님</td></tr>`).join('');
  return `<div class="row"><span class="muted">주도 섹터</span><span><b>${esc(c.lead)}</b> (${Object.entries(c.sector_avg).map(([k,v])=>esc(k)+' '+(v>0?'+':'')+v+'%').join(' / ')})</span></div>
    <div class="row"><span class="muted">코스피 조건 (≥ +${d.mom_cfg.index_min}%)</span><span>${typeof c.index_pct==='number'?pct(c.index_pct):'-'} <span class="badge ${idxOk?'b-ok':'b-warn'}">${idxOk?'충족':'미달 — 종목이 맞아도 매수 안 함'}</span></span></div>
    <div class="row"><span class="muted">지수 추세 (최근 ${d.mom_cfg.trend_min}분)</span><span>${trendTxt(c.trend)}</span></div>
    <div class="tblwrap"><table><tr><th></th><th>종목</th><th>섹터</th><th class="n">현재가</th><th class="n">등락률</th><th class="n">거래대금(원)</th><th>종목 조건</th></tr>${rows}</table></div>`;
}
async function loadCand(d){
  if (CAND.loading || Date.now() - CAND.t < 30000) return;
  CAND.loading = true;
  try {
    CAND.data = await (await fetch('/api/mom_candidates')).json();
    CAND.t = Date.now();
    const el = $('#candCard');
    if (el && TAB === 'mom') el.innerHTML = '<h2>선정 조건 근접 종목 TOP 5 (거래대금 순위 기준)</h2>' + candHtml(d);
  } catch(e) {} finally { CAND.loading = false; }
}

let SC = {t: 0, data: null, loading: false};
function scalpTable(d){
  const c = SC.data;
  if (!c) return '<span class="muted">불러오는 중…</span>';
  if (isErr(c)) return errTxt(c);
  const cf = d.scalp_cfg;
  const ok = v => v===null ? '<span class="muted">–</span>' : `<span class="${v?'up':'muted'}">${v?'●':'○'}</span>`;
  const rows = c.items.map(i => `<tr><td>${i.pick?'<b>매수 대상</b>':i.done?'익절(재매수 금지)':''}</td><td>${esc(i.name)}</td><td>${esc(i.sector)}</td>
    <td class="n">${won(i.price)}</td><td class="n">${pct(i.change_pct)}</td><td class="n">${i.vol_rate.toFixed(0)}%</td>
    <td>${ok(i.c_chg)} +${cf.min_change}% ${ok(i.c_vol)} 거래량 ${ok(i.c_sec)} 주도섹터 ${ok(i.c_trend)} 추세${i.watched?' · 포착':''}</td></tr>`).join('');
  return `<div class="row"><span class="muted">지수 (코스피 ≥ +${cf.index_min}% & 하락추세 아님)</span><span>${pct(c.index_pct)} · ${trendTxt(c.trend)} <span class="badge ${c.market_ok?'b-ok':'b-warn'}">${c.market_ok?'충족':'미충족'}</span></span></div>
    <div class="row"><span class="muted">주도 섹터 / 오늘 포착 후보</span><span><b>${esc(c.lead)}</b> / ${c.watch_count}종목</span></div>
    <div class="tblwrap"><table><tr><th></th><th>종목</th><th>섹터</th><th class="n">현재가</th><th class="n">등락률</th><th class="n">전일 거래량 대비</th><th>조건</th></tr>${rows}</table></div>`;
}
async function loadScalp(d){
  if (SC.loading || Date.now() - SC.t < 30000) return;
  SC.loading = true;
  try {
    SC.data = await (await fetch('/api/scalp_candidates')).json();
    SC.t = Date.now();
    const el = $('#scalpCard');
    if (el && TAB === 'scalp') el.innerHTML = '<h2>초단타 후보 TOP 5</h2>' + scalpTable(d);
  } catch(e) {} finally { SC.loading = false; }
}
function scalpCards(d){
  const c = d.scalp_cfg, b = d.balance, out = [];
  const sg = (d.signals || {}).scalp || {};
  out.push(`<div class="card wide" id="scalpCard"><h2>초단타 후보 TOP 5</h2>${scalpTable(d)}</div>`);
  out.push(`<div class="card"><h2>① 후보 선정 (09:05 / 09:30 / 10:00 스캔)</h2>
    <div class="rule"><b>1</b><span>전일 대비 <b>+${c.min_change}% 이상</b> 상승 (과열 20% 이상 제외)</span></div>
    <div class="rule"><b>2</b><span>누적 거래량이 <b>전일 거래량의 ${c.vol_rate}% 이상</b> (급증)</span></div></div>`);
  out.push(`<div class="card"><h2>② 매수 (10:10 / 10:20 / 10:30)</h2>
    ${c.require_mom?`<div class="rule"><b>3</b><span>모멘텀 조건: 코스피 +${c.index_min}% 이상, 주도 섹터 소속, 지수 하락 추세 아님</span></div>`:''}
    <div class="rule"><b>4</b><span>추세 유지: 현재가 ≥ 최근 스캔 가격, 등락률 여전히 +${c.min_change}% 이상</span></div>
    <div class="rule"><b>5</b><span>거래량 비율 상위 ${c.pick}종목, <b>하루 최대 ${c.max_buys}종목</b>, 익절한 종목은 당일 재매수 금지</span></div>
    ${!isErr(b)?`<div class="row"><span class="muted">초단타 예산 (총평가의 ${(c.ratio*100).toFixed(0)}%)</span><span>${won(d.budgets.scalp)}</span></div>`:''}</div>`);
  out.push(`<div class="card wide"><h2>③ 매도 (1분 감시, 시장가 · 비율은 최초 수량 기준, 수수료·세금 ${c.cost.toFixed(2)}% 차감 수익률)</h2>
    <div class="rule"><b>${c.stop}%</b><span>이하 → <b>전량</b> 매도</span></div>
    <div class="rule"><b>0%</b><span>${d.be_arm}% 이하까지 내려갔다가 본전 회복 → <b>${(c.be_ratio*100).toFixed(0)}%</b> 매도</span></div>
    ${c.tp.map(([p,r])=>`<div class="rule"><b>+${p}%</b><span>이상 → <b>${(r*100).toFixed(0)}%</b> 익절</span></div>`).join('')}
    <div class="rule"><b>${c.loss_min}분</b><span>매수 후 ${c.loss_min}분이 지나도 손실이면 텔레그램 알림</span></div>
    <div class="rule"><b>15:15</b><span>남은 수량 전량 정리</span></div></div>`);
  const sp = d.scalp_positions || {}, held = isErr(b) ? {} : b.holdings;
  const rows = Object.entries(sp).filter(([,p]) => p.date === d.now.slice(0,10)).map(([code,p]) => {
    const h = held[code], px = h ? h.price : null;
    const pnl = px && p.qty>0 ? (px/p.entry - 1 - c.cost/100)*100 : null;
    return `<tr><td>${esc(h?h.name:code)}</td><td>${esc(code)}</td><td>${esc((p.time||'').slice(11,16))}</td>
      <td class="n">${won(Math.round(p.entry))}</td><td class="n">${px?won(px):'-'}</td><td class="n">${pnl===null?'-':pct(pnl)}</td>
      <td class="n">${p.qty}/${p.base_qty}</td><td>${esc((p.steps||[]).join(', ')||'-')}</td></tr>`;
  }).join('');
  out.push(`<div class="card wide"><h2>오늘 초단타 (${Object.values(sp).filter(p=>p.date===d.now.slice(0,10)).length}/${c.max_buys}종목)${(d.scalp_done||[]).length?` · 익절 종목(재매수 금지): ${d.scalp_done.map(esc).join(', ')}`:''}</h2>${rows
    ?`<div class="tblwrap"><table><tr><th>종목</th><th>코드</th><th>매수</th><th class="n">매수가</th><th class="n">현재가</th><th class="n">수익률</th><th class="n">잔량/최초</th><th>실행 단계</th></tr>${rows}</table></div>`
    :'<span class="muted">오늘 매수한 종목 없음</span>'}</div>`);
  out.push(sigCard('최근 판단 · 초단타', sg, ''));
  return out;
}

function momCards(d){
  const c = d.mom_cfg, b = d.balance, out = [];
  const kospiOk = typeof d.kospi === 'number';
  out.push(`<div class="card wide" id="candCard"><h2>선정 조건 근접 종목 TOP 5 (거래대금 순위 기준)</h2>${candHtml(d)}</div>`);
  const kOk = kospiOk && d.kospi >= c.index_min;
  const sg = (d.signals || {}).momentum || {};
  out.push(`<div class="card"><h2>① 매수 조건 (10:01, 모두 충족)</h2>
    <div class="rule"><b>1</b><span>코스피 전일 대비 <b>+${c.index_min}% 이상</b>
      ${kospiOk?` · 현재 ${pct(d.kospi)} <span class="badge ${kOk?'b-ok':'b-warn'}">${kOk?'충족':'미달'}</span>`:''}</span></div>
    <div class="rule"><b>2</b><span>종목이 <b>당일 주도 섹터</b> 소속 (섹터 내 등락률 평균 1위)이고 <b>등락률 > 0</b></span></div>

    <div class="rule"><b>5</b><span>조건 충족 종목 중 <b>거래대금 상위 ${c.pick}종목</b> 매수 (매수 2호가 지정가)</span></div>

  out.push(`<div class="card"><h2>② 예산</h2>
    <div class="row"><span class="muted">모멘텀 예산 비중</span><span>총평가금액의 ${(c.budget_ratio*100).toFixed(0)}% (단타 40% × 50%)</span></div>
    ${!isErr(b)?`<div class="row"><span class="muted">현재 모멘텀 예산</span><span>${won(Math.floor(b.total*c.budget_ratio))}</span></div>`:''}
    <div class="row"><span class="muted">종목당</span><span>예산 ÷ 매수 종목 수</span></div>
    <div class="row"><span class="muted">수익률 계산</span><span>매수가 대비, 왕복 수수료·세금 ${c.cost.toFixed(2)}% 차감</span></div></div>`);
  const tp = c.tp.map(([p, r]) => `<div class="rule"><b>+${p}%</b><span>이상 → <b>${(r*100).toFixed(0)}%</b> 매도 (익절)</span></div>`).join('');
  out.push(`<div class="card wide"><h2>③ 손절 / 본전 / 익절 (10:02~15:19, 1분 간격 감시, 시장가 · 비율은 최초 수량 기준, 단계별 1회)</h2>
    <div class="rule"><b>${c.stop_pct}%</b><span>이하 → <b>${(c.stop_ratio*100).toFixed(0)}%</b> 매도 (1차 손절)</span></div>
    <div class="rule"><b>+${c.stop2_wait}분</b><span>1차 손절 ${c.stop2_wait}분 뒤에도 ${c.stop_pct}% 이하 → <b>${(c.stop2_ratio*100).toFixed(0)}%</b> 추가 매도 (2차 손절, 회복했으면 안 함)</span></div>
    <div class="rule"><b>0%</b><span>${d.be_arm}% 이하까지 내려갔다가 본전(수수료 포함) 회복 → <b>${(c.be_ratio*100).toFixed(0)}%</b> 매도</span></div>
    ${tp}</div>`);
  out.push(`<div class="card wide"><h2>④ 잔량 매도</h2>
    <div class="rule"><b>19:30</b><span>NXT 애프터마켓 지정가 (현재가 -${c.nxt_ticks}틱) 매도. 실패 시 텔레그램 알림</span></div>
    <div class="rule"><b>09:05</b><span>다음 영업일 정규장 시장가로 잔여 정리</span></div></div>`);


  const mp = d.mom_positions || {};

  const rows = Object.entries(mp).map(([code, p]) => {
    const h = held[code], px = h ? h.price : null;
    const pnl = px && p.entry ? (px / p.entry - 1 - c.cost / 100) * 100 : null;

      <td class="n">${pnl===null?'-':pct(pnl)}</td><td class="n">${p.qty}/${p.base_qty||p.qty}</td>
      <td>${esc((p.steps||[]).join(', ')||'-')}${p.was_neg?' · 본전매도 대기':''}</td></tr>`;
  }).join('');
  out.push(`<div class="card wide"><h2>모멘텀 보유 현황</h2>${rows
    ?`<div class="tblwrap"><table><tr><th>종목</th><th>코드</th><th>매수일</th><th class="n">매수가</th><th class="n">현재가</th><th class="n">수익률</th><th class="n">잔량/최초</th><th>실행된 단계</th></tr>${rows}</table></div>`
    :'<span class="muted">보유 중인 모멘텀 종목 없음</span>'}</div>`);

  return out;
}

// ---------------------------------------------------------------- 탭별 공통 조각
const pnlOf = (px, entry, cost) => px && entry ? (px / entry - 1 - cost / 100) * 100 : null;
function logCard(d, re){
  const lines = (d.logs||[]).filter(l => re.test(l));
  return `<div class="card wide"><h2>최근 로그</h2><pre id="log">${lines.map(l=>{
    const m = l.match(/ (WARNING|ERROR) /); return `<span class="${m?m[1]:''}">${esc(l)}</span>`}).join('\n')||'관련 로그 없음'}</pre></div>`;
}
// 전략별 보유 행
function posRows(d){
  const b = d.balance, held = isErr(b) ? {} : b.holdings, cost = d.mom_cfg.cost, today = d.now.slice(0,10), out = [];
  const add = (tag, code, p, entry) => {
    const h = held[code] || {};
    out.push({tag, code, name: h.name || (d.names||{})[code] || code, qty: p.qty, price: h.price, entry: entry || h.avg || null});
  };
  if (d.covered_call_code && held[d.covered_call_code]) { const h = held[d.covered_call_code]; add('공포지수', d.covered_call_code, {qty: h.qty}, h.avg); }
  Object.entries(d.box_positions||{}).filter(([,p])=>p.qty>0).forEach(([c,p]) => add('박스권', c, p, p.entry));
  Object.entries(d.mom_positions||{}).filter(([,p])=>p.qty>0).forEach(([c,p]) => add('모멘텀', c, p, p.entry));
  Object.entries(d.scalp_positions||{}).filter(([,p])=>p.date===today && p.qty>0).forEach(([c,p]) => add('초단타', c, p, p.entry));
  return out.map(r => ({...r, pnl: pnlOf(r.price, r.entry, r.tag==='공포지수'?0:cost)}));
}
function posTable(rows, empty){
  if (!rows.length) return `<span class="muted">${empty}</span>`;
  return `<div class="tblwrap"><table><tr><th>구분</th><th>종목</th><th>코드</th><th class="n">수량</th><th class="n">현재가</th><th class="n">평가금액</th><th class="n">수익률</th></tr>${rows.map(r =>
    `<tr><td>${esc(r.tag)}</td><td>${esc(r.name)}</td><td>${esc(r.code)}</td><td class="n">${r.qty}</td><td class="n">${r.price?won(r.price):'-'}</td>
     <td class="n">${r.price?won(r.qty*r.price):'-'}</td><td class="n">${r.pnl===null?'-':pct(r.pnl)}</td></tr>`).join('')}</table></div>`;
}
function idxRows(d){
  const row = (name, v, note) => isErr(v) || !v
    ? `<div class="row"><span class="muted">${name}</span><span class="err">${isErr(v)?esc(v.error):'-'}</span></div>`
    : `<div class="row"><span class="muted">${name}${note||''}</span><span><b>${num(v.price)}</b> ${pct(v.change_pct)}</span></div>`;
  const kr = d.indices || {}, us = d.us_indices;
  return row('코스피', kr['코스피']) + row('코스닥', kr['코스닥']) +
    (isErr(us) ? `<div class="row"><span class="muted">미국 지수</span><span class="err">${esc(us.error)}</span></div>`
               : Object.entries(us||{}).map(([n,v]) => row(n, v, ' <span class="muted" style="font-size:11px">(전일 종가 대비)</span>')).join(''));
}
function marketCard(d){
  const vix = d.vix, vixOk = typeof vix === 'number';
  let vixState = '대기';
  if (vixOk) vixState = vix >= d.vix_buy ? '매수 신호' : vix <= d.vix_sell_ladder[0] ? '매도 구간' : '관망';
  return `<div class="card"><h2>시장 지수</h2>
    ${idxRows(d)}
    <div class="row"><span class="muted">VIX</span><span><b>${vixOk?vix.toFixed(2):'-'}</b> · ${vixState}</span></div>
    <div class="row"><span class="muted">VIX 매수 기준 / 매도 시작</span><span>≥${d.vix_buy} / ≤${d.vix_sell_ladder[0]}</span></div>
    ${isErr(vix)?errTxt(vix):''}${isErr(d.kospi)?errTxt(d.kospi):''}
    ${d.cc && !isErr(d.cc)?`<div class="row"><span class="muted">${esc(d.cc.name||'커버드콜')} (${esc(d.cc.code)})</span><span>${won(d.cc.price)} ${pct(d.cc.change_pct)}</span></div>`:''}</div>`;
}
function accountCard(d){
  const b = d.balance;
  if (isErr(b)) return `<div class="card"><h2>계좌</h2>${errTxt(b)}</div>`;
  const r = k => `${(d.alloc[k]*100).toFixed(0)}% · ${won(Math.floor(b.total*d.alloc[k]))}`;
  return `<div class="card"><h2>계좌</h2><div class="big">${won(b.total)}</div>
    <div class="row"><span class="muted">예수금</span><span>${won(b.cash)}</span></div>
    <div class="row"><span class="muted">공포지수 예산</span><span>${r('fear')}</span></div>
    <div class="row"><span class="muted">박스권 예산</span><span>${r('box')}</span></div>
    <div class="row"><span class="muted">모멘텀 예산</span><span>${r('mom')}</span></div>
    <div class="row"><span class="muted">초단타 예산</span><span>${r('scalp')}</span></div></div>`;
}
function scheduleCard(d){
  return `<div class="card wide"><h2>스케줄 (평일)</h2><div class="tblwrap"><table>
    <tr><th>시각</th><th>작업</th><th>다음 실행</th><th></th></tr>
    ${d.jobs.map(j=>`<tr><td>${j.time}</td><td>${esc(j.label)}</td><td>${j.next}</td>
    <td><button data-job="${j.id}" data-label="${esc(j.label)}">지금 실행</button></td></tr>`).join('')}
    </table></div></div>`;
}

function overviewCards(d){
  const rows = posRows(d), out = [accountCard(d), marketCard(d)];
  const groups = ['공포지수','박스권','모멘텀','초단타'].map(t => {
    const r = rows.filter(x => x.tag === t);
    return `<div class="row"><span class="muted">${t}</span><span>${r.length?r.map(x=>esc(x.name)).join(', '):'보유 없음'}</span></div>`;
  }).join('');
  out.push(`<div class="card wide"><h2>전략별 종목 현황</h2>${groups}<div style="margin-top:10px">${posTable(rows, '보유 종목 없음')}</div></div>`);
  out.push(scheduleCard(d));
  return out;
}

function fearTab(d){
  const f = d.fear || {}, fc = d.fear_cfg, out = [marketCard(d)];
  out.push(`<div class="card"><h2>① 조건 (15:10, 하루 1회)</h2>
    <div class="rule"><b>매수</b><span>VIX <b>≥ ${d.vix_buy}</b> → 공포 예산의 <b>${(fc.tranche*100).toFixed(0)}%</b>씩 분할 매수 (매수 2호가 지정가, 예산 한도 내)</span></div>
    <div class="rule"><b>매도</b><span>VIX <b>≤ ${d.vix_sell_ladder[0]}</b> 부터, 단계(${d.vix_sell_ladder.join(', ')}) 처음 도달할 때마다 최대 보유량의 <b>${(fc.step_ratio*100).toFixed(0)}%</b>, 하루 1단계</span></div>
    <div class="rule"><b>대상</b><span>${esc((d.cc&&d.cc.name)||'KODEX 200 커버드콜 액티브')} (${esc(d.covered_call_code)})</span></div>
    <div class="row"><span class="muted">공포지수 예산</span><span>${isErr(d.balance)?'-':won(Math.floor(d.balance.total*d.alloc.fear))} (${(d.alloc.fear*100).toFixed(0)}%)</span></div></div>`);
  out.push(`<div class="card"><h2>② 상태</h2>
    <div class="row"><span class="muted">마지막 매수일</span><span>${esc(f.last_buy_date||'-')}</span></div>
    <div class="row"><span class="muted">마지막 매도일</span><span>${esc(f.last_sell_date||'-')}</span></div>
    <div class="row"><span class="muted">매도 단계 진행</span><span>${(f.sold_steps||[]).length} / ${d.vix_sell_ladder.length}</span></div>
    <div class="row"><span class="muted">기준 수량</span><span>${f.peak_qty||0}주</span></div></div>`);
  out.push(`<div class="card wide"><h2>공포지수 보유 현황</h2>${posTable(posRows(d).filter(x=>x.tag==='공포지수'), '보유 종목 없음')}</div>`);
  out.push(logCard(d, / fear:|공포|VIX/));
  return out;

function boxTab(d){
  const bc = d.box_cfg, out = [boxCard(d.box)];
  out.push(`<div class="card"><h2>① 매수 (15:20 종가 단일가)</h2>
    <div class="rule"><b>조건</b><span>박스 내 위치 <b>${(d.box?d.box.buy_pos*100:20).toFixed(0)}% 이하</b> (박스 폭 ${(bc.min_width*100).toFixed(0)}% 이상일 때만, 하단 -10% 넘게 이탈하면 매수 안 함)</span></div>
    <div class="rule"><b>대상</b><span>주도 섹터 거래대금 상위 ${bc.pick}종목 · 매수 2호가 지정가</span></div>
    <div class="row"><span class="muted">박스권 예산</span><span>${isErr(d.balance)?'-':won(Math.floor(d.balance.total*d.alloc.box))} (${(d.alloc.box*100).toFixed(0)}%)</span></div></div>`);
  out.push(`<div class="card"><h2>② 매도 / 손절</h2>
    <div class="rule"><b>분할</b><span>박스 위치 ${bc.ladder.map(t=>(t*100).toFixed(0)+'%').join(' / ')} 처음 도달할 때마다 <b>${(bc.sell_ratio*100).toFixed(0)}%</b> (15:00, 마지막은 전량)</span></div>
    <div class="rule"><b>${bc.stop}%</b><span>이하 → <b>전량</b> 손절 (평균 매수가 대비, 수수료·세금 ${d.mom_cfg.cost.toFixed(2)}% 차감, 09:05~15:19 1분 감시)</span></div></div>`);
  const rows = posRows(d).filter(x => x.tag === '박스권');
  out.push(`<div class="card wide"><h2>박스권 보유 현황</h2>${posTable(rows, '보유 중인 박스권 종목 없음')}</div>`);
  const sg = (d.signals||{}).box;
  out.push(sigCard('최근 판단 · 박스권 전략', sg, sg && sg.pos!==undefined ? `<div class="row"><span class="muted">박스 내 위치</span><span>${(sg.pos*100).toFixed(0)}%</span></div>` : ''));
  out.push(logCard(d, /박스|box/));
  return out;
}

function render(d){
  $('#now').textContent = d.now;
  $('#badges').innerHTML =
    `<span class="badge ${d.mode==='live'?'b-bad':'b-warn'}">${d.mode==='live'?'실전':'모의투자'}</span>` +
    `<span class="badge ${d.dry_run?'b-ok':'b-bad'}">${d.dry_run?'DRY_RUN (주문 안 나감)':'실주문 ON'}</span>` +
    `<button class="${d.dry_run?'':'warnbtn'}" id="dryBtn">${d.dry_run?'실주문 켜기':'DRY_RUN 켜기 (주문 중단)'}</button>` +
    `<button class="${d.mode==='live'?'ghost':'warnbtn'}" id="modeBtn">${d.mode==='live'?'모의투자로 전환':'실전으로 전환'}</button>`;
  $('#modeBtn').onclick = async () => {
    let body;
    if (d.mode === 'live') {
      if (!confirm('모의투자 모드로 전환할까요?')) return;
      body = {mode: 'mock'};
    } else {
      const t = prompt('⚠ 실전 계좌(실제 돈)로 전환합니다.\n전환 직후에는 DRY_RUN 이 켜진 상태로 시작합니다.\n계속하려면 "실전" 이라고 입력하세요.');
      if (t !== '실전') return;
      body = {mode: 'live', confirm: '실전'};
    }
    const r = await fetch('/api/mode', {method:'POST', headers:{'X-Requested-With':'dashboard','Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.error) alert(j.error);
    load(true);
  };
  $('#dryBtn').onclick = async () => {
    let body;
    if (d.dry_run) {
      const t = prompt('⚠ 실제 주문을 켭니다. 지금부터 실제 돈으로 매매됩니다.\n계속하려면 "실주문" 이라고 입력하세요.');
      if (t !== '실주문') return;
      body = {dry_run: false, confirm: '실주문'};
    } else {
      if (!confirm('DRY_RUN 을 켜고 주문을 중단할까요?')) return;
      body = {dry_run: true};
    }
    const r = await fetch('/api/dry_run', {method:'POST', headers:{'X-Requested-With':'dashboard','Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.error) alert(j.error);
    load(true);
  };

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tab === TAB);
    t.onclick = () => { TAB = t.dataset.tab; try{localStorage.setItem('tab', TAB);}catch(e){} render(d); };
  });
  const b = d.balance;
  const show = cards => { $('#grid').innerHTML = cards.join(''); bind(d); };
  if (TAB === 'scalp') { show(scalpCards(d)); loadScalp(d); return; }
  if (TAB === 'mom') { show(momCards(d)); loadCand(d); return; }
  if (TAB === 'box') { show(boxTab(d)); return; }
  if (TAB === 'fear') { show(fearTab(d)); return; }
  show(overviewCards(d));

}

function bind(d){
  const lg = $('#log'); if (lg) lg.scrollTop = lg.scrollHeight;
  const postBox = async body => {
    const r = await fetch('/api/box', {method:'POST', headers:{'X-Requested-With':'dashboard','Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.error) { $('#boxErr').textContent = j.error; return; }
    load(true);
  };
  if ($('#boxSave')) $('#boxSave').onclick = () => postBox({lower: $('#boxLo').value, upper: $('#boxHi').value});
  if ($('#boxAuto')) $('#boxAuto').onclick = () => postBox({auto: true});
  document.querySelectorAll('button[data-job]').forEach(btn => btn.onclick = async () => {
    const msg = d.dry_run ? `'${btn.dataset.label}' 을(를) 지금 실행할까요? (DRY_RUN: 주문 안 나감)`
                          : `⚠ 실주문이 켜져 있습니다. '${btn.dataset.label}' 을(를) 지금 실행하면 실제 주문이 나갈 수 있습니다. 계속할까요?`;
    if (!confirm(msg)) return;
    btn.disabled = true;
    await fetch('/api/run/' + btn.dataset.job, {method:'POST', headers:{'X-Requested-With':'dashboard'}});
    setTimeout(() => load(true), 2500);
  });
}

let busy = false;
async function load(force){
  if (busy) return; busy = true;
  try {
    const r = await fetch('/api/status' + (force ? '?force=1' : ''));
    const data = await r.json();
    // 입력 중에는 자동 갱신으로 입력값이 지워지지 않게 건너뜀
    if (force || !(document.activeElement && document.activeElement.tagName === 'INPUT')) render(data);
  } catch(e) {
    $('#grid').innerHTML = `<div class="card err">서버에 연결할 수 없습니다: ${esc(e)}</div>`;
  } finally { busy = false; }
}
$('#refresh').onclick = () => load(true);
$('#pwBtn').onclick = async () => {
  const cur = prompt('현재 비밀번호를 입력하세요');
  if (cur === null) return;
  const nw = prompt('새 비밀번호 (4자 이상)');
  if (nw === null) return;
  if (nw !== prompt('새 비밀번호를 한 번 더 입력하세요')) { alert('두 번 입력한 값이 다릅니다'); return; }
  const r = await fetch('/api/password', {method:'POST', headers:{'X-Requested-With':'dashboard','Content-Type':'application/json'}, body:JSON.stringify({current:cur, new:nw})});
  const j = await r.json();
  alert(j.error ? j.error : '비밀번호가 변경되었습니다');
};
load(); setInterval(load, 15000);
</script>
</body>
